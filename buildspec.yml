version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "Installing dependencies..."
      - pip install -r requirements.txt

  build:
    commands:
      - echo "Running fraud detection..."
      - python src/fraud_detection.py

  post_build:
    commands:
      - echo "Running tests..."
      - pytest

artifacts:
  files:
    - output/processed_transactions.csv